[workspace]
resolver = "2"
members = ["crates/*", "examples/protocol", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
anyhow = "1"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
static_assertions = "1"
strum = { version = "0.28", features = ["derive"] }
itertools = "0.14"
ordered-float = "5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro-crate = "3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

raw_ffi = { package = "mojo-sys", path = "crates/mojo-sys" }
c_mojo_api = { package = "mojo-c-api", path = "crates/mojo-c-api" }
system = { package = "mojo-system", path = "crates/mojo-system" }
mojom_value_parser_core = { package = "mojom-codec-core", path = "crates/mojom-codec-core" }
parsing_attribute = { package = "mojom-derive", path = "crates/mojom-derive" }
mojom_value_parser = { package = "mojom-codec", path = "crates/mojom-codec" }
bindings = { package = "mojo-bindings", path = "crates/mojo-bindings" }
sequenced_task_runner = { package = "mojo-sequence", path = "crates/mojo-sequence" }
mojo-ipc = { path = "crates/mojo-ipc" }
mojom-build = { path = "crates/mojom-build" }

