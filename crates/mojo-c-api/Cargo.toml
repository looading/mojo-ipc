[package]
name = "mojo-c-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Safe Mojo C API wrappers for the unofficial Chromium Mojo Rust SDK"
readme = "README.md"

[package.metadata.mojo]
chromium-revision = "bcbc09a9f8e4c3fd3ad2ed9cbad41e63c35ccfdd"

[dependencies]
raw_ffi = { package = "mojo-sys", path = "../mojo-sys", version = "=0.2.2" }
bitflags = "2"
static_assertions = "1"
strum = { version = "0.28", features = ["derive"] }
