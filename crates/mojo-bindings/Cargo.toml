[package]
name = "mojo-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Typed Mojo Remote and Receiver bindings for the unofficial Rust SDK"
readme = "README.md"

[package.metadata.mojo]
chromium-revision = "bcbc09a9f8e4c3fd3ad2ed9cbad41e63c35ccfdd"

[dependencies]
system = { package = "mojo-system", path = "../mojo-system", version = "=0.2.2" }
mojom_value_parser = { package = "mojom-codec", path = "../mojom-codec", version = "=0.2.2" }
mojom_value_parser_core = { package = "mojom-codec-core", path = "../mojom-codec-core", version = "=0.2.2" }
sequenced_task_runner = { package = "mojo-sequence", path = "../mojo-sequence", version = "=0.2.2" }
anyhow = "1"
bitflags = "2"

[dev-dependencies]
raw_ffi.workspace = true
