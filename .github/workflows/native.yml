name: Native Mojo build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the matching version tag after all targets pass
        type: boolean
        default: false
      release_tag:
        description: Existing version tag to build with this workflow (for example v0.2.2)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate version and release tooling
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Check out the workflow's release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require version tags to match Cargo
        id: version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish || false }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          sys.path.insert(0, "native/scripts")
          from package_native import version
          value = version()
          ref = os.environ["GITHUB_REF"]
          tag = os.environ["REQUESTED_TAG"] or (ref.removeprefix("refs/tags/") if ref.startswith("refs/tags/") else "")
          if tag and tag != "v" + value:
              raise SystemExit("release tag must match workspace.package.version: v" + value)
          publish = os.environ["PUBLISH_REQUESTED"] == "true" or (os.environ["GITHUB_EVENT_NAME"] == "push" and bool(tag))
          if publish and not tag:
              raise SystemExit("publish requires an explicit matching version tag")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"version={value}\ncommit={commit}\ntag={tag}\npublish={str(publish).lower()}\n")
      - name: Test native release tooling without Chromium
        run: python -B -m unittest discover -s .release-tools/native/scripts -p 'test_release.py' -v

  native:
    name: Native ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            system: Linux
            gn_os: linux
            cpu: x64
            library: libmojo_rs_native.so
            gn_args: 'use_glib=false use_siso=false use_remoteexec=false symbol_level=0'
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            system: Darwin
            gn_os: mac
            cpu: x64
            library: libmojo_rs_native.dylib
            gn_args: 'use_system_xcode=true use_siso=false use_remoteexec=false symbol_level=0'
          - target: aarch64-apple-darwin
            runner: macos-15
            system: Darwin
            gn_os: mac
            cpu: arm64
            library: libmojo_rs_native.dylib
            gn_args: 'use_system_xcode=true use_siso=false use_remoteexec=false symbol_level=0'
          - target: x86_64-pc-windows-msvc
            runner: windows-2025-vs2026
            system: Windows
            gn_os: win
            cpu: x64
            library: mojo_rs_native.dll
            gn_args: 'use_siso=false use_remoteexec=false symbol_level=0'
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      NATIVE_EXPECTED_SYSTEM: ${{ matrix.system }}
      NATIVE_GN_OS: ${{ matrix.gn_os }}
      NATIVE_CPU: ${{ matrix.cpu }}
      NATIVE_LIBRARY_NAME: ${{ matrix.library }}
      NATIVE_GN_ARGS: ${{ matrix.gn_args }}
      SDK_COMMIT: ${{ needs.version.outputs.commit }}
      MOJOM_PYTHON: python
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.commit }}
      - name: Check out the workflow's release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.cpu }}

      - name: Select an installed macOS SDK with Chromium module maps
        if: runner.os == 'macOS'
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def compatible_xcodes(applications):
              required = ["DarwinBasic.modulemap", "DarwinFoundation1.modulemap",
                          "DarwinFoundation2.modulemap", "DarwinFoundation3.modulemap",
                          "libunwind.modulemap"]
              candidates = {}
              for application in applications.glob("Xcode*.app"):
                  application = application.resolve()
                  sdks = application / "Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs"
                  for sdk in sdks.glob("MacOSX*.sdk"):
                      sdk = sdk.resolve()
                      if all((sdk / "usr/include" / name).is_file() for name in required):
                          settings = json.loads((sdk / "SDKSettings.json").read_text())
                          version = str(settings.get("Version", ""))
                          if re.fullmatch(r"\d+(?:\.\d+)*", version):
                              candidates[(application, sdk)] = tuple(int(n) for n in version.split("."))
              return sorted(candidates, key=lambda item: candidates[item])

          choices = compatible_xcodes(Path("/Applications"))
          if not choices:
              raise SystemExit("no installed Xcode SDK contains the pinned Chromium DarwinFoundation module maps")
          application, sdk = choices[-1]
          developer = application / "Contents/Developer"
          subprocess.run(["sudo", "xcode-select", "--switch", str(developer)], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"DEVELOPER_DIR={developer}\nSDKROOT={sdk}\n")
          print(f"Selected compatible Xcode: {application}; macOS SDK: {sdk}")

      - name: Install pinned Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Check and test all Cargo targets
        run: |
          import os
          import subprocess
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != os.environ["SDK_COMMIT"]:
              raise SystemExit("SDK checkout does not match the validated source commit")
          for operation in ["check", "test"]:
              subprocess.run([
                  "cargo", "+1.96.0", operation, "--workspace", "--all-targets",
                  "--locked", "--target", os.environ["NATIVE_TARGET"],
              ], check=True)

      - name: Test the real official Mojom generator
        run: |
          import subprocess
          import sys
          subprocess.run([sys.executable, "-B", "tools/mojom/test_codegen.py"], check=True)

      - name: Install the pinned Windows SDK and debugging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $header = "$sdkRoot\Include\10.0.28000.0\um\Windows.h"
          if (-not (Test-Path $header) -or -not (Test-Path "$sdkRoot\Debuggers\x64\dbghelp.dll")) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest 'https://download.microsoft.com/download/78b533c3-6724-4e28-a984-b9fa93265781/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
            $expected = 'e9f1bde566381355e594e2f90daf4f714eb5c7ef2c45c501ce236afe2abea300'
            if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
              throw 'Windows SDK installer checksum mismatch'
            }
            $process = Start-Process $installer -ArgumentList '/quiet /norestart /features +' -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Windows SDK install failed: $($process.ExitCode)" }
          }
          if (-not (Test-Path $header)) { throw 'Windows SDK 10.0.28000.0 headers are missing' }
          if (-not (Test-Path "$sdkRoot\Debuggers\x64\dbghelp.dll")) { throw 'SDK Debugging Tools are missing' }

      - name: Provision pinned Chromium on this fresh hosted runner
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([sys.executable, "native/scripts/prepare_hosted.py", "--root",
                          str(Path(os.environ["RUNNER_TEMP"]) / "mojo-chromium")], check=True)

      - name: Verify standalone license scanning with the pinned GN
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subdir, executable = {
              "Linux": ("linux64", "gn"), "Darwin": ("mac", "gn"), "Windows": ("win", "gn.exe"),
          }[os.environ["NATIVE_EXPECTED_SYSTEM"]]
          env = dict(os.environ, MOJO_TEST_GN=str(Path(os.environ["CHROMIUM_SRC"]) / "buildtools" / subdir / executable))
          subprocess.run([sys.executable, "-B", ".release-tools/native/scripts/test_release.py",
                          "HostedTests.test_license_scan_preserves_standalone_graph_root", "-v"], env=env, check=True)

      - name: Use pinned GN and Ninja without depot_tools Python launchers
        run: |
          import os
          from pathlib import Path
          import shutil
          source = Path(os.environ["CHROMIUM_SRC"])
          system = os.environ["NATIVE_EXPECTED_SYSTEM"]
          subdir = {"Linux": "linux64", "Darwin": "mac", "Windows": "win"}[system]
          suffix = ".exe" if system == "Windows" else ""
          tools = source.parent / "pinned-build-tools"
          tools.mkdir()
          # Older SDK builders prefer the name autoninja. Its compatibility
          # alias here is the actual pinned Ninja binary; remote execution and
          # Siso are explicitly disabled in this hosted producer configuration.
          for original, name in (
              (source / "buildtools" / subdir / ("gn" + suffix), "gn" + suffix),
              (source / "third_party/ninja" / ("ninja" + suffix), "autoninja" + suffix),
          ):
              if not original.is_file():
                  raise SystemExit(f"pinned build tool missing: {original}")
              shutil.copy2(original, tools / name)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as stream:
              stream.write(str(tools) + "\n")

      - name: Set the native smoke runtime search path
        if: runner.os != 'Windows'
        run: |
          import os
          variable = {"Linux": "LD_LIBRARY_PATH", "Darwin": "DYLD_LIBRARY_PATH"}[os.environ["NATIVE_EXPECTED_SYSTEM"]]
          paths = [os.environ["MOJO_NATIVE_BUILD_DIR"]]
          paths.extend(path for path in os.environ.get(variable, "").split(os.pathsep) if path)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"{variable}={os.pathsep.join(paths)}\n")

      - name: Build the native library and run native smoke
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          artifact = Path(os.environ["MOJO_NATIVE_ARTIFACT_DIR"])
          subprocess.run([
              sys.executable, "native/scripts/build_native.py",
              "--chromium-src", os.environ["CHROMIUM_SRC"],
              "--out", os.environ["MOJO_NATIVE_BUILD_DIR"],
              "--target-cpu", os.environ["NATIVE_CPU"],
              "--jobs", "2", "--gn-args", os.environ["NATIVE_GN_ARGS"],
              "--smoke", "--artifact-dir", str(artifact),
          ], check=True)
          manifest = json.loads((artifact / "native-manifest.json").read_text(encoding="utf-8"))
          expected = {
              "chromium_commit": "bcbc09a9f8e4c3fd3ad2ed9cbad41e63c35ccfdd",
              "abi_version": 1,
              "os": os.environ["NATIVE_GN_OS"],
              "cpu": os.environ["NATIVE_CPU"],
              "library": os.environ["NATIVE_LIBRARY_NAME"],
              "native_smoke_passed": True,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"native manifest mismatch for {key}: {manifest.get(key)!r} != {value!r}")
          library = Path(os.environ["MOJO_RUNTIME_LIBRARY"])
          if not library.is_file() or hashlib.sha256(library.read_bytes()).hexdigest() != manifest.get("sha256"):
              raise SystemExit("native library is missing or its checksum does not match the manifest")

      - name: Run the independent-process named-channel fixture
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys

          artifact = Path(os.environ["MOJO_NATIVE_ARTIFACT_DIR"])
          executable = Path(os.environ["MOJO_NATIVE_BUILD_DIR"]) / (
              "runtime_smoke.exe" if os.environ["NATIVE_EXPECTED_SYSTEM"] == "Windows" else "runtime_smoke"
          )
          result = subprocess.run([
              sys.executable, "native/scripts/named_smoke.py",
              "--executable", str(executable),
              "--work-dir", str(artifact / "named-smoke"),
          ], text=True, encoding="utf-8", errors="replace", capture_output=True, timeout=120)
          sys.stdout.write(result.stdout)
          sys.stderr.write(result.stderr)
          (artifact / "named-smoke-driver.log").write_text(result.stdout + result.stderr, encoding="utf-8")
          if result.returncode:
              raise SystemExit(f"independent-process named-channel fixture failed: exit {result.returncode}")

      - name: Run the real Rust parent-child typed IPC example
        run: |
          import datetime
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys

          artifact = Path(os.environ["MOJO_NATIVE_ARTIFACT_DIR"])
          command = [
              "cargo", "+1.96.0", "run", "--locked", "--target", os.environ["NATIVE_TARGET"],
              "-p", "mojo-example-protocol", "--example", "echo",
          ]
          result = subprocess.run(command, text=True, encoding="utf-8", errors="replace", capture_output=True, timeout=180)
          sys.stdout.write(result.stdout)
          sys.stderr.write(result.stderr)
          (artifact / "typed-echo.log").write_text(result.stdout + result.stderr, encoding="utf-8")
          if result.returncode:
              raise SystemExit(f"typed parent-child IPC example failed: exit {result.returncode}")
          receipt = {
              "target": os.environ["NATIVE_TARGET"],
              "sdk_commit": os.environ["SDK_COMMIT"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_REF"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "recorded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "runner_system": platform.system(),
              "runner_machine": platform.machine(),
              "python": sys.version.split()[0],
              "rust": "1.96.0",
              "cargo_check_passed": True,
              "cargo_tests_passed": True,
              "official_mojom_boundary_tests_passed": True,
              "native_smoke_passed": True,
              "independent_named_process_fixture_passed": True,
              "typed_parent_child_example_passed": True,
              "native_manifest": "native-manifest.json",
              "runtime_dependency_audit": "pending package audit",
          }
          (artifact / "acceptance-manifest.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")

      - name: Audit exports and dependencies, collect licenses, and package
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          subprocess.run([
              sys.executable, ".release-tools/native/scripts/package_native.py",
              "--sdk-root", str(Path.cwd()),
              "--artifact-dir", os.environ["MOJO_NATIVE_ARTIFACT_DIR"],
              "--chromium-src", os.environ["CHROMIUM_SRC"],
              "--out", os.environ["MOJO_NATIVE_BUILD_DIR"],
              "--target", os.environ["NATIVE_TARGET"],
              "--output-dir", str(Path("dist/packages") / os.environ["NATIVE_TARGET"]),
          ], env=dict(os.environ, GITHUB_SHA=os.environ["SDK_COMMIT"]), check=True)

      - name: Upload versioned native packages
        uses: actions/upload-artifact@v4
        with:
          name: mojo-native-package-${{ matrix.target }}
          overwrite: true
          path: dist/packages/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics when available
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mojo-native-diagnostics-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/${{ matrix.target }}/named-smoke/
            dist/${{ matrix.target }}/named-smoke-driver.log
            dist/${{ matrix.target }}/typed-echo.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish the complete native release
    needs: [version, native]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mojo-native-package-*
          path: dist/release
          merge-multiple: true
      - name: Verify all four packages and publish their Release
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_COMMIT: ${{ needs.version.outputs.commit }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          tag = os.environ["RELEASE_TAG"]
          references = subprocess.check_output([
              "git", "ls-remote", "origin", "refs/tags/" + tag, "refs/tags/" + tag + "^{}",
          ], text=True).splitlines()
          resolved = {line.split()[1]: line.split()[0] for line in references}
          commit = resolved.get("refs/tags/" + tag + "^{}", resolved.get("refs/tags/" + tag))
          if commit != os.environ["SDK_COMMIT"]:
              raise SystemExit("release tag moved after source validation; refusing to publish")
          # The publishing script runs against the validated SDK tag checkout.
          # Its provenance is separate from a manually selected workflow ref.
          env = dict(os.environ, GITHUB_SHA=commit, GITHUB_REF="refs/tags/" + tag)
          subprocess.run([sys.executable, "native/scripts/release_native.py",
                          "--package-dir", "dist/release", "--tag", tag], env=env, check=True)
